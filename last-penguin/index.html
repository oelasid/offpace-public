<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LAST PENGUIN — Modular Character v2</title>
  <style>
    :root{color-scheme:light;--ink:#172036;--panel:rgba(255,255,255,.82)}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:Inter,ui-rounded,"Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;background:radial-gradient(circle at 50% 25%,#fff 0%,#edf8ff 48%,#d8edfb 100%);color:var(--ink)}#app,#viewport{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}.title{position:absolute;top:24px;left:26px;z-index:5;pointer-events:none;text-shadow:0 1px 0 rgba(255,255,255,.75)}.title h1{margin:0;font-size:clamp(28px,4vw,58px);line-height:.88;letter-spacing:-.04em}.title h1 span{display:block;color:#78a8ce;font-size:.62em;letter-spacing:.08em}.title p{margin:10px 0 0;font-size:12px;letter-spacing:.15em;opacity:.72}.panel{position:absolute;left:24px;bottom:24px;z-index:5;width:min(470px,calc(100vw - 48px));padding:14px;border-radius:20px;border:1px solid rgba(90,135,170,.16);background:var(--panel);backdrop-filter:blur(16px);box-shadow:0 16px 50px rgba(41,86,120,.12)}.label{font-size:11px;font-weight:800;letter-spacing:.14em;opacity:.58;margin:0 0 8px 4px}.row{display:flex;flex-wrap:wrap;gap:7px}button{appearance:none;border:0;border-radius:999px;padding:9px 12px;background:rgba(65,88,112,.08);color:var(--ink);font:inherit;font-size:12px;font-weight:750;cursor:pointer;transition:transform .15s ease,background .15s ease}button:hover{transform:translateY(-1px);background:rgba(65,88,112,.13)}button.active{background:var(--ink);color:#fff}.tools button.active{background:#c9473b}.spacer{height:12px}.hint{margin:10px 4px 0;font-size:11px;opacity:.58;line-height:1.6}.badge{position:absolute;right:22px;top:22px;z-index:5;padding:8px 11px;border-radius:999px;background:rgba(255,255,255,.68);backdrop-filter:blur(10px);font-size:11px;font-weight:800;letter-spacing:.08em;opacity:.85}.parts-note{position:absolute;right:22px;bottom:22px;z-index:4;max-width:310px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.64);backdrop-filter:blur(12px);font-size:11px;line-height:1.55;color:#51647d}.parts-note b{color:#24324a}@media(max-width:640px){.title{top:18px;left:18px}.panel{left:12px;bottom:12px;width:calc(100vw - 24px);padding:11px}.badge,.parts-note{display:none}button{padding:8px 10px}}
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"}}</script>
</head>
<body>
  <div id="app">
    <div id="viewport"></div>
    <div class="title"><h1><span>LAST</span>PENGUIN</h1><p>MODULAR TOON CHARACTER / THREE.JS</p></div>
    <div class="badge">v2 · part-by-part procedural mesh</div>
    <div class="parts-note"><b>v2構造</b><br>頭・顔・胴体・翼・足・目・くちばし・毛・マフラーを個別生成して最後に組み立てています。「分解表示」で接合構造を確認できます。</div>
    <div class="panel">
      <div class="label">EXPRESSION</div><div class="row" id="expressions"></div>
      <div class="spacer"></div><div class="label">MOTION</div><div class="row" id="motions"></div>
      <div class="spacer"></div><div class="label">MESH DEBUG</div><div class="row tools"><button id="explode" aria-pressed="false">分解表示</button><button id="wireframe" aria-pressed="false">ワイヤーフレーム</button></div>
      <div class="hint">ドラッグ: 回転 / ホイール: ズーム / マウス移動: 視線<br>分解表示では各メッシュの接合位置を確認できます。</div>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
